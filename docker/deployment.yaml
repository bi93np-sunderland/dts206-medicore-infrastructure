apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicore-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicore-app
  template:
    metadata:
      labels:
        app: medicore-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: medicore-container
        image: mendhak/http-https-echo:31
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
