apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicore-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicore
  template:
    metadata:
      labels:
        app: medicore
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: medicore-container
        image: medicore-app:latest
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
